<svg viewBox="0 0 860 315" width="860" height="315" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.lbl{opacity:0;animation:fade .6s ease-out forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}.d5{animation-delay:1.8s}
.year{fill:#93C5FD;font-size:12px;font-weight:600}
.role{fill:#F8FAFC;font-size:13px;font-weight:700}
.date{fill:#93C5FD;font-size:12px;font-weight:500}
.legend{fill:#DBEAFE;font-size:12px}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
</style>

<rect x="0" y="0" width="860" height="315" rx="14" fill="#0B1F3A"/>

<!-- year axis: x = 60 + (year - 2017) * 74 -->
<line x1="60" y1="52" x2="800" y2="52" stroke="#1E3A8A" stroke-width="2"/>
<g class="year" text-anchor="middle">
  <text x="60" y="38">2017</text><text x="134" y="38">2018</text><text x="208" y="38">2019</text><text x="282" y="38">2020</text>
  <text x="356" y="38">2021</text><text x="430" y="38">2022</text><text x="504" y="38">2023</text><text x="578" y="38">2024</text>
  <text x="652" y="38">2025</text><text x="726" y="38">2026</text><text x="800" y="38">2027</text>
</g>
<g stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 4">
  <line x1="60" y1="52" x2="60" y2="280"/><line x1="134" y1="52" x2="134" y2="280"/><line x1="208" y1="52" x2="208" y2="280"/><line x1="282" y1="52" x2="282" y2="280"/>
  <line x1="356" y1="52" x2="356" y2="280"/><line x1="430" y1="52" x2="430" y2="280"/><line x1="504" y1="52" x2="504" y2="280"/><line x1="578" y1="52" x2="578" y2="280"/>
  <line x1="652" y1="52" x2="652" y2="280"/><line x1="726" y1="52" x2="726" y2="280"/><line x1="800" y1="52" x2="800" y2="280"/>
</g>

<!-- B.Tech: Jan 2017 - Feb 2020 (education, outlined) -->
<text class="lbl d1" x="60" y="80"><tspan class="role">B.Tech Mechanical Engineering · Charusat University</tspan><tspan class="date" dx="8">2017 – 2020</tspan></text>
<rect class="bar d1" x="60" y="88" width="228" height="14" rx="7" fill="#0B1F3A" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 3"/>

<!-- Hexaware: Jun 2019 - Dec 2020 -->
<text class="lbl d2" x="239" y="125"><tspan class="role">Supply Chain Coordinator · Hexaware Technologies</tspan><tspan class="date" dx="8">2019 – 2020</tspan></text>
<rect class="bar d2" x="239" y="133" width="111" height="14" rx="7" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>

<!-- M.S.: Jan 2021 - Jan 2023 (education, outlined) -->
<text class="lbl d3" x="356" y="170"><tspan class="role">M.S. Supply Chain Management · University of Texas</tspan><tspan class="date" dx="8">2021 – 2023</tspan></text>
<rect class="bar d3" x="356" y="178" width="148" height="14" rx="7" fill="#0B1F3A" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 3"/>

<!-- Walgreens: Mar 2023 - Jul 2024 -->
<text class="lbl d4" x="516" y="215"><tspan class="role">Supply Chain Analyst · Walgreens</tspan><tspan class="date" dx="8">2023 – 2024</tspan></text>
<rect class="bar d4" x="516" y="223" width="99" height="14" rx="7" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>

<!-- Mondelez: Aug 2024 - present -->
<text class="lbl d5" x="785" y="260" text-anchor="end"><tspan class="role">Supply Chain Analyst · Mondelez International</tspan></text>
<rect class="bar d5" x="621" y="268" width="164" height="14" rx="7" fill="#2563EB" stroke="#DBEAFE" stroke-width="1.5"/>
<g class="lbl d5">
  <circle cx="785" cy="275" r="6" fill="#93C5FD"/>
  <circle cx="785" cy="275" r="6" fill="none" stroke="#93C5FD" stroke-width="2">
    <animate attributeName="r" values="6;16" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- legend -->
<g class="legend">
  <rect x="60" y="295" width="22" height="8" rx="4" fill="#1E3A8A" stroke="#93C5FD"/><text x="90" y="303">Work</text>
  <rect x="140" y="295" width="22" height="8" rx="4" fill="#0B1F3A" stroke="#3B82F6" stroke-dasharray="4 2"/><text x="170" y="303">Education</text>
  <circle cx="246" cy="299" r="4" fill="#93C5FD"/><text x="256" y="303">Current role</text>
</g>
</svg>
